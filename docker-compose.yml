# PostgreSQL for Budget App development
# Run: docker compose up -d
# Connect: localhost:5432 (user: postgres, password: postgres, db: budget_app)
services:
  postgres:
    image: postgres:16-alpine
    container_name: budget-app-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: budget_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
